<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>One More Orbit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; touch-action: none; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  canvas { display: block; }

  #score {
    position: fixed; top: 28px; left: 0; right: 0;
    text-align: center; color: #fff; font-size: 52px; font-weight: 200;
    letter-spacing: 4px; pointer-events: none;
  }

  #death {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.88);
    flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    color: #fff; cursor: pointer;
  }
  #death.show { display: flex; }
  #death h1 { font-size: 56px; font-weight: 100; letter-spacing: 6px; }
  #death .pts { font-size: 22px; font-weight: 300; opacity: 0.6; letter-spacing: 2px; }
  #death .tap { font-size: 15px; opacity: 0.35; letter-spacing: 3px; text-transform: uppercase; margin-top: 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="score">0</div>
<div id="death">
  <h1>collapse</h1>
  <div class="pts" id="final"></div>
  <div class="tap">tap to restart</div>
</div>

<script>
// ─── Canvas setup ────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; cx = W/2; cy = H/2; }
resize();
window.addEventListener('resize', resize);

// ─── Constants ───────────────────────────────────────────────────
const PLANET_R      = 22;
const GM            = 14000;   // planet gravity strength
const PULL_STR      = 500;     // finger pull acceleration
const CAPTURE_R     = 200;     // BIG capture zone — liberal
const MAX_CAP_SPEED = 9999;    // no speed limit — if you're in the zone, you lock
const MAX_MOONS     = 5;
const SPAWN_MS      = 5000;
const ORBIT_SPEED   = 3.5;    // captured moons orbit 3.5x faster than bare physics (visual only)

// ─── Audio ───────────────────────────────────────────────────────
let ac;
function audio() { if (!ac) ac = new (AudioContext || webkitAudioContext)(); return ac; }

function beep(freq, dur = 0.45, vol = 0.35) {
  const a = audio(), osc = a.createOscillator(), g = a.createGain();
  osc.connect(g); g.connect(a.destination);
  osc.frequency.value = freq; osc.type = 'sine';
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
  osc.start(); osc.stop(a.currentTime + dur);
}

function boom() {
  const a = audio(), buf = a.createBuffer(1, a.sampleRate * 0.35, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length) ** 2;
  const src = a.createBufferSource(), g = a.createGain();
  src.buffer = buf; src.connect(g); g.connect(a.destination); g.gain.value = 0.25;
  src.start();
}

// Sustained hum per orbiting moon
const hums = new Map();
function startHum(id, freq) {
  const a = audio(), osc = a.createOscillator(), g = a.createGain();
  osc.connect(g); g.connect(a.destination);
  osc.frequency.value = freq; osc.type = 'sine'; g.gain.value = 0.055;
  osc.start();
  hums.set(id, { osc, g });
}
function stopHum(id) {
  const h = hums.get(id); if (!h) return;
  h.g.gain.exponentialRampToValueAtTime(0.001, audio().currentTime + 0.3);
  h.osc.stop(audio().currentTime + 0.3);
  hums.delete(id);
}
function stopAllHums() { [...hums.keys()].forEach(stopHum); }

// ─── Palette ─────────────────────────────────────────────────────
const COLORS = ['#7ecef4','#f4c06f','#f47e7e','#a8f47e','#d07ef4','#f4a87e','#7ef4d0'];
const NOTES  = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];

// ─── Stars ───────────────────────────────────────────────────────
let stars = [];
function mkStars() {
  stars = Array.from({length:100}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.1+0.2, a: Math.random()*0.5+0.1
  }));
}
mkStars();

// ─── Game state ──────────────────────────────────────────────────
let moons = [], particles = [], flashes = [], score = 0, dead = false, uid = 0;
let touch = null, spawnTimer = 0;

function mkMoon() {
  const edge = Math.floor(Math.random()*4);
  const ci   = Math.floor(Math.random()*COLORS.length);
  const r    = 9 + Math.random()*12;
  const spd  = 28 + Math.random()*38;
  const nudge = () => (Math.random()-0.5)*18;
  let x, y, vx, vy;
  if      (edge===0) { x=Math.random()*W; y=-r;   vx=(cx-x)*0.06+nudge(); vy=spd;  }
  else if (edge===1) { x=W+r; y=Math.random()*H;   vx=-spd;  vy=(cy-y)*0.06+nudge(); }
  else if (edge===2) { x=Math.random()*W; y=H+r;   vx=(cx-x)*0.06+nudge(); vy=-spd; }
  else               { x=-r;  y=Math.random()*H;   vx=spd;   vy=(cy-y)*0.06+nudge(); }
  return { id:uid++, x, y, vx, vy, r, color:COLORS[ci], freq:NOTES[ci%NOTES.length],
           orbiting:false, orbitR:0, orbitAngle:0, orbitDir:1 };
}

function burst(x, y, color, n=20) {
  for (let i=0; i<n; i++) {
    const a=Math.random()*Math.PI*2, s=50+Math.random()*120;
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      r:1.5+Math.random()*3, color, life:1, d:0.02+Math.random()*0.025 });
  }
}

function die() {
  if (dead) return;
  dead = true; stopAllHums();
  document.getElementById('final').textContent = score + (score===1?' moon captured':' moons captured');
  document.getElementById('death').classList.add('show');
}

function restart() {
  moons=[]; particles=[]; flashes=[]; score=0; dead=false; spawnTimer=0; uid=0;
  document.getElementById('score').textContent='0';
  document.getElementById('death').classList.remove('show');
  // stagger first two moons
  setTimeout(()=>{ if(!dead) moons.push(mkMoon()); }, 600);
  setTimeout(()=>{ if(!dead) moons.push(mkMoon()); }, 2400);
  requestAnimationFrame(frame);
}

// ─── Capture on release ──────────────────────────────────────────
function tryCapture() {
  let any = false;
  for (const m of moons) {
    if (m.orbiting) continue;
    const dx = cx-m.x, dy = cy-m.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    const spd  = Math.sqrt(m.vx*m.vx+m.vy*m.vy);
    if (dist < CAPTURE_R && spd < MAX_CAP_SPEED && dist > PLANET_R+m.r+2) {
      // Determine direction from cross product of (outward radial) × velocity
      const rx=-dx/dist, ry=-dy/dist;
      const cross = rx*m.vy - ry*m.vx;
      m.orbiting   = true;
      m.orbitR     = dist;
      m.orbitAngle = Math.atan2(m.y-cy, m.x-cx);
      m.orbitDir   = cross >= 0 ? 1 : -1;
      m.vx = m.vy  = 0;
      score++;
      document.getElementById('score').textContent = score;
      beep(m.freq);
      startHum(m.id, m.freq);
      // capture flash
      flashes.push({ x: m.x, y: m.y, r: m.r+4, color: m.color, life: 1 });
      any = true;
    }
  }
  return any;
}

// ─── Input ───────────────────────────────────────────────────────
function pt(e) { return e.touches ? e.touches[0] : e; }
canvas.addEventListener('mousedown',  e => { audio(); touch={x:pt(e).clientX,y:pt(e).clientY}; });
canvas.addEventListener('mousemove',  e => { if(touch) touch={x:pt(e).clientX,y:pt(e).clientY}; });
canvas.addEventListener('mouseup',    () => { tryCapture(); touch=null; });
canvas.addEventListener('touchstart', e => { e.preventDefault(); audio(); touch={x:pt(e).clientX,y:pt(e).clientY}; }, {passive:false});
canvas.addEventListener('touchmove',  e => { e.preventDefault(); if(touch) touch={x:pt(e).clientX,y:pt(e).clientY}; }, {passive:false});
canvas.addEventListener('touchend',   e => { e.preventDefault(); tryCapture(); touch=null; }, {passive:false});

document.getElementById('death').addEventListener('click', restart);
document.getElementById('death').addEventListener('touchstart', e => { e.preventDefault(); restart(); }, {passive:false});

// ─── Main loop ───────────────────────────────────────────────────
let last = 0;
function frame(ts) {
  if (dead) return;
  const dt = Math.min((ts-last)/1000, 0.05);
  last = ts;

  // Spawn
  spawnTimer += dt*1000;
  if (spawnTimer > SPAWN_MS && moons.length < MAX_MOONS) {
    moons.push(mkMoon());
    spawnTimer = 0;
  }

  const remove = new Set();

  for (const m of moons) {
    if (m.orbiting) {
      // Advance along perfect circle
      const w = Math.sqrt(GM/m.orbitR)/m.orbitR * ORBIT_SPEED;
      m.orbitAngle += w * m.orbitDir * dt;
      m.x = cx + Math.cos(m.orbitAngle)*m.orbitR;
      m.y = cy + Math.sin(m.orbitAngle)*m.orbitR;
      continue;
    }

    // Planet gravity
    const dx=cx-m.x, dy=cy-m.y, dist=Math.sqrt(dx*dx+dy*dy);

    // Hit planet → game over
    if (dist < PLANET_R+m.r) { burst(m.x,m.y,m.color,30); boom(); die(); return; }

    const g = GM/(dist*dist);
    m.vx += (dx/dist)*g*dt;
    m.vy += (dy/dist)*g*dt;

    // Finger pull — soft and continuous toward touch point
    if (touch) {
      const fx=touch.x-m.x, fy=touch.y-m.y;
      const fd=Math.sqrt(fx*fx+fy*fy)+1;
      const f = PULL_STR / fd; // force falls off with distance
      m.vx += (fx/fd)*f*dt;
      m.vy += (fy/fd)*f*dt;
    }



    m.x += m.vx*dt;
    m.y += m.vy*dt;

    // Off-screen → silently gone
    if (m.x<-250||m.x>W+250||m.y<-250||m.y>H+250) remove.add(m.id);
  }

  // Moon-moon collision → game over
  for (let i=0; i<moons.length; i++) {
    if (remove.has(moons[i].id)) continue;
    for (let j=i+1; j<moons.length; j++) {
      if (remove.has(moons[j].id)) continue;
      const a=moons[i], b=moons[j];
      const dx=a.x-b.x, dy=a.y-b.y;
      if (dx*dx+dy*dy < (a.r+b.r)*(a.r+b.r)) {
        burst((a.x+b.x)/2,(a.y+b.y)/2,a.color,16);
        burst((a.x+b.x)/2,(a.y+b.y)/2,b.color,16);
        boom(); die(); return;
      }
    }
  }

  moons = moons.filter(m=>!remove.has(m.id));

  // Particles
  for (const p of particles) {
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.92; p.vy*=0.92; p.life-=p.d;
  }
  particles = particles.filter(p=>p.life>0);

  // Capture flashes — expand ring + fade
  for (const f of flashes) { f.r += 120*dt; f.life -= 3*dt; }
  flashes = flashes.filter(f=>f.life>0);

  draw();
  requestAnimationFrame(frame);
}

// ─── Draw ────────────────────────────────────────────────────────
function draw() {
  ctx.fillStyle='#04040f';
  ctx.fillRect(0,0,W,H);

  // Stars
  for (const s of stars) {
    ctx.globalAlpha=s.a; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // Capture zone ring
  const moonInZone = moons.some(m=>!m.orbiting && Math.hypot(m.x-cx,m.y-cy)<CAPTURE_R);
  ctx.beginPath(); ctx.arc(cx,cy,CAPTURE_R,0,Math.PI*2);
  ctx.setLineDash([5,9]);
  ctx.strokeStyle = moonInZone
    ? `rgba(255,255,255,${0.14+0.07*Math.sin(Date.now()/180)})`
    : 'rgba(255,255,255,0.05)';
  ctx.lineWidth = moonInZone ? 1.5 : 1;
  ctx.stroke();
  ctx.setLineDash([]);

  // Touch pull rings (animate outward from finger)
  if (touch) {
    for (let i=0; i<3; i++) {
      const t = ((Date.now()/500 + i/3) % 1);
      ctx.beginPath(); ctx.arc(touch.x,touch.y,10+t*50,0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,255,255,${0.18*(1-t)})`;
      ctx.lineWidth=1.2; ctx.stroke();
    }
  }

  // Orbit rings for locked moons
  for (const m of moons) {
    if (!m.orbiting) continue;
    ctx.beginPath(); ctx.arc(cx,cy,m.orbitR,0,Math.PI*2);
    ctx.strokeStyle=m.color+'1e'; ctx.lineWidth=1; ctx.stroke();
  }

  // Planet
  const pg=ctx.createRadialGradient(cx-5,cy-5,2,cx,cy,PLANET_R);
  pg.addColorStop(0,'#cde8ff'); pg.addColorStop(0.5,'#4a90d4'); pg.addColorStop(1,'#1a3a6a');
  ctx.beginPath(); ctx.arc(cx,cy,PLANET_R,0,Math.PI*2);
  ctx.fillStyle=pg; ctx.fill();
  // glow
  ctx.beginPath(); ctx.arc(cx,cy,PLANET_R+9,0,Math.PI*2);
  ctx.strokeStyle='rgba(100,180,255,0.12)'; ctx.lineWidth=7; ctx.stroke();

  // Moons
  for (const m of moons) {
    const inZone = !m.orbiting && Math.hypot(m.x-cx,m.y-cy)<CAPTURE_R;

    // Pulse halo when in capture zone
    if (inZone) {
      const p=0.5+0.5*Math.sin(Date.now()/140);
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r+6+p*4,0,Math.PI*2);
      ctx.strokeStyle=m.color+'60'; ctx.lineWidth=2.5; ctx.stroke();
    }

    ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2);
    ctx.fillStyle=m.color; ctx.fill();

    if (m.orbiting) {
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r+4,0,Math.PI*2);
      ctx.strokeStyle=m.color+'50'; ctx.lineWidth=2.5; ctx.stroke();
    }
  }

  // Capture flash rings
  for (const f of flashes) {
    ctx.globalAlpha = f.life * f.life;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
    ctx.strokeStyle = f.color; ctx.lineWidth = 3; ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Particles
  for (const p of particles) {
    ctx.globalAlpha=p.life*p.life;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color; ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ─── Boot ────────────────────────────────────────────────────────
setTimeout(()=>moons.push(mkMoon()), 700);
setTimeout(()=>moons.push(mkMoon()), 2600);
requestAnimationFrame(frame);
</script>
</body>
</html>
